<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Universal AI Agent WebUI</title>
    <style>
        * { box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: #0f172a;
            color: #f8fafc;
            margin: 0;
            padding: 20px;
            overflow-x: hidden;
        }
        .main-layout {
            display: flex;
            gap: 20px;
            max-width: 1440px;
            width: 100%;
            margin: 0 auto;
            align-items: stretch;
        }
        .sidebar {
            width: 340px;
            min-width: 340px;
            flex-shrink: 0;
            background: #1e293b;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.5);
            height: calc(100vh - 40px);
            min-height: 700px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 18px;
        }
        .content {
            flex: 1 1 auto;
            min-width: 0;
            background: #1e293b;
            padding: 28px;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.5);
            display: flex;
            flex-direction: column;
        }
        h1, h3 { color: #38bdf8; margin-top: 0; }
        textarea {
            width: 100%;
            height: 95px;
            background: #0f172a;
            color: #fff;
            border: 1px solid #475569;
            border-radius: 8px;
            padding: 12px;
            font-size: 15px;
            resize: vertical;
        }
        input, select {
            width: 100%;
            background: #0f172a;
            color: #fff;
            border: 1px solid #475569;
            border-radius: 6px;
            padding: 8px;
            margin-top: 5px;
            margin-bottom: 12px;
        }
        .btn-group {
            display: flex;
            gap: 12px;
            margin-top: 12px;
            width: 100%;
        }
        button {
            flex: 1 1 0;
            min-width: 0;
            background: #0284c7;
            color: white;
            border: none;
            padding: 12px 20px;
            font-size: 15px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            transition: background 0.2s;
        }
        button:hover { background: #0ea5e9; }
        button:disabled { background: #475569; cursor: not-allowed; }
        .btn-stop { background: #dc2626 !important; }
        .btn-stop:hover { background: #ef4444 !important; }
        .btn-stop:disabled { background: #475569 !important; }
        .tab-bar {
            display: flex;
            gap: 6px;
            margin-bottom: 12px;
            width: 100%;
        }
        .tab-btn {
            flex: 1 1 0;
            min-width: 0;
            padding: 8px 6px;
            font-size: 12px;
            background: #0f172a;
            color: #94a3b8;
            border: 1px solid #334155;
            border-radius: 6px;
        }
        .tab-btn:hover { background: #1e293b; color: #f8fafc; }
        .tab-btn.active {
            background: #0284c7;
            color: #ffffff;
            border-color: #0284c7;
        }
        pre {
            width: 100%;
            max-width: 100%;
            background: #0f172a;
            padding: 15px;
            border-radius: 8px;
            border: 1px solid #334155;
            height: 440px;
            overflow-y: auto;
            overflow-x: auto;
            white-space: pre-wrap;
            word-break: break-word;
            font-family: "Fira Code", monospace;
            font-size: 13px;
            line-height: 1.45;
            color: #38bdf8;
            margin-bottom: 0;
        }
        .task-item {
            background: #0f172a;
            padding: 10px;
            margin-bottom: 8px;
            border-radius: 6px;
            cursor: pointer;
            border: 1px solid #334155;
            font-size: 13px;
            transition: border 0.2s;
            word-break: break-word;
        }
        .task-item:hover { border-color: #38bdf8; }
        .item-meta {
            display: block;
            font-size: 11px;
            color: #94a3b8;
            margin-top: 4px;
        }
        .config-section { border-top: 1px solid #334155; padding-top: 15px; }
        label { font-size: 13px; color: #94a3b8; }
        @media (max-width: 900px) {
            .main-layout { flex-direction: column; }
            .sidebar { width: 100%; min-width: 0; height: auto; }
        }
    </style>
</head>
<body>
    <div class="main-layout">
        <div class="sidebar">
            <div>
                <h3>⚙ Конфигурация</h3>
                <div class="config-section">
                    <label>Модель агента (Default):</label>
                    <input type="text" id="cfgDefaultModel">

                    <label>Модель критика (Critic):</label>
                    <input type="text" id="cfgCriticModel">

                    <label>Макс. итераций:</label>
                    <input type="number" id="cfgMaxIter">

                    <label>Число ролей (параллельно):</label>
                    <input type="number" id="cfgMultiRole">

                    <button onclick="saveConfig()" style="background: #0d9488; font-size: 14px; padding: 9px; width: 100%;">Сохранить конфиг</button>
                </div>
            </div>

            <div style="flex-grow: 1; display: flex; flex-direction: column; min-height: 0;">
                <div class="tab-bar">
                    <button id="tabBtnTasks" class="tab-btn active" onclick="switchTab('tasks')">📁 Задачи</button>
                    <button id="tabBtnSkills" class="tab-btn" onclick="switchTab('skills')">🧠 Навыки</button>
                    <button id="tabBtnMemory" class="tab-btn" onclick="switchTab('memory')">🗄 Память</button>
                </div>
                <div id="sidebarList" style="flex-grow: 1; overflow-y: auto;">Загрузка...</div>
            </div>
        </div>

        <div class="content">
            <h1>Universal Multi-Agent System</h1>
            <p style="margin-top: 0; color: #cbd5e1;">Введите сложную задачу для параллельной декомпозиции и мультиролевого анализа:</p>
            <textarea id="taskInput" placeholder="Например: Разработать микросервис на FastAPI..."></textarea>

            <div class="btn-group">
                <button id="submitBtn" onclick="startTask()">Запустить задачу</button>
                <button id="stopBtn" class="btn-stop" onclick="stopTask()" disabled>Остановить</button>
            </div>

            <h3 id="viewerTitle" style="margin-top: 22px;">Лог выполнения в реальном времени (SSE):</h3>
            <pre id="logOutput">Ожидание задачи...</pre>
        </div>
    </div>

    <script>
        let eventSource = null;
        let currentTab = 'tasks';
        let cachedMemory = [];

        function escapeHtml(text) {
            return String(text || '')
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;');
        }

        async function loadConfig() {
            try {
                const res = await fetch('/api/config');
                const cfg = await res.json();
                document.getElementById("cfgDefaultModel").value = cfg.ollama.default_model;
                document.getElementById("cfgCriticModel").value = cfg.ollama.critic_model;
                document.getElementById("cfgMaxIter").value = cfg.execution.max_iterations;
                document.getElementById("cfgMultiRole").value = cfg.execution.multi_role_count;
            } catch (e) {
                console.error("Ошибка загрузки конфига:", e);
            }
        }

        async function saveConfig() {
            const data = {
                default_model: document.getElementById("cfgDefaultModel").value,
                critic_model: document.getElementById("cfgCriticModel").value,
                max_iterations: parseInt(document.getElementById("cfgMaxIter").value),
                multi_role_count: parseInt(document.getElementById("cfgMultiRole").value)
            };
            const res = await fetch('/api/config', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify(data)
            });
            const result = await res.json();
            alert(result.status === "success" ? "Конфигурация успешно обновлена!" : "Ошибка сохранения");
        }

        function switchTab(tabName) {
            currentTab = tabName;
            document.getElementById("tabBtnTasks").classList.toggle("active", tabName === "tasks");
            document.getElementById("tabBtnSkills").classList.toggle("active", tabName === "skills");
            document.getElementById("tabBtnMemory").classList.toggle("active", tabName === "memory");
            refreshSidebar();
        }

        async function refreshSidebar() {
            if (currentTab === 'tasks') {
                await loadHistory();
            } else if (currentTab === 'skills') {
                await loadSkills();
            } else if (currentTab === 'memory') {
                await loadMemory();
            }
        }

        async function loadHistory() {
            try {
                const res = await fetch('/api/tasks');
                const tasks = await res.json();
                const listEl = document.getElementById("sidebarList");
                if (!tasks || tasks.length === 0) {
                    listEl.innerHTML = "<p style='color: #64748b; font-size: 13px;'>Нет сохраненных задач</p>";
                    return;
                }
                listEl.innerHTML = tasks.map(t => `
                    <div class="task-item" onclick="loadTaskResult('${escapeHtml(t)}')">
                        📁 ${escapeHtml(t.replace('task_', '').replace('.md', ''))}
                    </div>
                `).join('');
            } catch (e) {
                console.error("Ошибка загрузки истории:", e);
            }
        }

        async function loadSkills() {
            try {
                const res = await fetch('/api/skills');
                const skills = await res.json();
                const listEl = document.getElementById("sidebarList");
                if (!skills || skills.length === 0) {
                    listEl.innerHTML = "<p style='color: #64748b; font-size: 13px;'>Навыки пока не сохранены</p>";
                    return;
                }
                listEl.innerHTML = skills.map(s => {
                    const id = escapeHtml(s.id || s.file || 'skill');
                    const file = escapeHtml(s.file || '');
                    const pattern = escapeHtml((s.task_pattern || 'Без описания').slice(0, 85));
                    return `
                        <div class="task-item" onclick="loadSkillDetail('${file}')">
                            🧠 <strong>${id}</strong>
                            <span class="item-meta">${pattern}</span>
                        </div>
                    `;
                }).join('');
            } catch (e) {
                console.error("Ошибка загрузки навыков:", e);
            }
        }
        async function loadMemory() {
            try {
                const res = await fetch('/api/memory');
                cachedMemory = await res.json();
                const listEl = document.getElementById("sidebarList");
                if (!cachedMemory || cachedMemory.length === 0) {
                    listEl.innerHTML = "<p style='color: #64748b; font-size: 13px;'>Векторная память пуста</p>";
                    return;
                }
                listEl.innerHTML = cachedMemory.map((m, idx) => {
                    const taskTitle = escapeHtml((m.task || 'Без названия').slice(0, 80));
                    const badge = m.skill_file ? ` | 🔗 ${escapeHtml(m.skill_file)}` : '';
                    return `
                        <div class="task-item" onclick="showMemoryDetail(${idx})">
                            🗄 ${taskTitle}
                            <span class="item-meta">${escapeHtml(m.timestamp || '')}${badge}</span>
                        </div>
                    `;
                }).join('');
            } catch (e) {
                console.error("Ошибка загрузки памяти:", e);
            }
        }

        async function loadTaskResult(filename) {
            if (eventSource) eventSource.close();
            document.getElementById("viewerTitle").textContent = `Просмотр задачи: ${filename}`;
            const res = await fetch(`/api/task/${filename}`);
            const data = await res.json();
            const logEl = document.getElementById("logOutput");
            logEl.textContent = data.content || data.error || "Пустой файл";
            logEl.scrollTop = 0;
        }

        async function loadSkillDetail(filename) {
            if (!filename) return;
            if (eventSource) eventSource.close();
            document.getElementById("viewerTitle").textContent = `Навык: ${filename}`;
            const res = await fetch(`/api/skill/${filename}`);
            const data = await res.json();
            const logEl = document.getElementById("logOutput");
            if (data.error) {
                logEl.textContent = data.error;
                return;
            }
            const cmds = (data.commands || []).map((c, i) => `${i + 1}. ${c}`).join('\n');
            logEl.textContent =
                `ID навыка: ${data.id || filename}\n` +
                `Создан: ${data.created_at || '-'}\n` +
                `Паттерн задачи: ${data.task_pattern || '-'}\n\n` +
                `=== Проверенные команды ===\n${cmds || 'Нет команд'}\n\n` +
                `=== Резюме решения ===\n${data.summary || '-'}`;
            logEl.scrollTop = 0;
        }

        function showMemoryDetail(index) {
            const item = cachedMemory[index];
            if (!item) return;
            if (eventSource) eventSource.close();
            document.getElementById("viewerTitle").textContent = `Запись памяти (${item.timestamp || '-'})`;
            const logEl = document.getElementById("logOutput");
            logEl.textContent =
                `Задача: ${item.task || '-'}\n` +
                `Дата: ${item.timestamp || '-'}\n` +
                `Вектор (embedding): ${item.has_embedding ? 'Да' : 'Нет'}\n` +
                `Связанный навык: ${item.skill_file || 'Нет'}\n\n` +
                `=== Сохранённое решение ===\n${item.solution || '-'}`;
            logEl.scrollTop = 0;
        }

        function setRunningState(isRunning) {
            document.getElementById("submitBtn").disabled = isRunning;
            document.getElementById("stopBtn").disabled = !isRunning;
        }

        function connectSSE() {
            if (eventSource) eventSource.close();
            eventSource = new EventSource('/api/stream-logs');
            const logEl = document.getElementById("logOutput");

            eventSource.onmessage = function(event) {
                const data = JSON.parse(event.data);
                const isAtBottom = (logEl.scrollHeight - logEl.scrollTop - logEl.clientHeight) < 60;
                logEl.textContent = data.log;
                if (isAtBottom) {
                    logEl.scrollTop = logEl.scrollHeight;
                }
                setRunningState(data.running);
                if (!data.running) {
                    eventSource.close();
                    refreshSidebar();
                }
            };

            eventSource.onerror = function() {
                eventSource.close();
                setRunningState(false);
            };
        }

        async function startTask() {
            const task = document.getElementById("taskInput").value.trim();
            if (!task) {
                alert("Введите текст задачи!");
                return;
            }
            setRunningState(true);
            document.getElementById("viewerTitle").textContent = "Лог выполнения в реальном времени (SSE):";
            document.getElementById("logOutput").textContent = "Отправка задачи...";

            const res = await fetch('/api/run', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({ task: task })
            });
            const data = await res.json();
            if (data.status === "started" || data.status === "already_running") {
                connectSSE();
            } else {
                setRunningState(false);
            }
        }

        async function stopTask() {
            await fetch('/api/stop', { method: 'POST' });
        }

        window.onload = async function() {
            await loadConfig();
            await refreshSidebar();
            connectSSE();
        };
    </script>
</body>
</html>
